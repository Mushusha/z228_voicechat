<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>zalupa228local</title>
    <link rel="icon" type="image/png" href="./logo.png" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html[data-theme="dark"] {
        --bg: #1d1f24;
        --surface: #23262d;
        --surface-hover: #2b2f38;
        --border: #3a3f4b;
        --text: #f3f4f6;
        --text-muted: #9ca3af;
        --accent: #22d3ee;
        --accent-dim: rgba(34, 211, 238, 0.2);
        --input-bg: #2b2f38;
        --danger: #f87171;
      }

      html[data-theme="light"] {
        --bg: #e6e6e6;
        --surface: #dcdcdc;
        --surface-hover: #d0d0d0;
        --border: #b8b8b8;
        --text: #1a1a1a;
        --text-muted: #4b5563;
        --accent: #0891b2;
        --accent-dim: rgba(8, 145, 178, 0.2);
        --input-bg: #f0f0f0;
        --danger: #dc2626;
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }

      .app {
        display: flex;
        height: 100vh;
        height: 100dvh;
        min-height: 0;
      }

      .mobile-tabs {
        display: none;
      }

      .sidebar {
        width: 288px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        background: var(--surface);
        border-right: 1px solid var(--border);
        min-height: 0;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 18px 16px;
        border-bottom: 1px solid var(--border);
      }

      .brand .logo {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        object-fit: cover;
        flex-shrink: 0;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      }

      .brand-text {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }

      .brand-name {
        font-weight: 700;
        font-size: 1.05rem;
        letter-spacing: -0.02em;
      }

      .brand-tag {
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      .sidebar-scroll {
        flex: 1;
        min-height: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .sidebar-body {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 12px 16px 8px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .sidebar-donate {
        flex-shrink: 0;
        padding: 12px 16px 16px;
        border-top: 1px solid var(--border);
        text-align: center;
        background: var(--surface);
      }

      .donate-qr {
        width: 132px;
        height: 132px;
        max-width: 100%;
        object-fit: contain;
        border-radius: 8px;
        background: #fff;
        padding: 6px;
        display: block;
        margin: 0 auto;
        box-sizing: border-box;
      }

      .donate-caption {
        margin: 10px 0 0;
        font-size: 0.875rem;
        font-weight: 700;
        color: var(--accent);
        letter-spacing: 0.06em;
        text-transform: lowercase;
      }

      .toolbar {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .row.toggles {
        flex-direction: column;
        align-items: flex-start;
      }

      label.chk {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.875rem;
        color: var(--text);
        cursor: pointer;
        user-select: none;
      }

      input[type="text"] {
        flex: 1;
        min-width: 120px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--input-bg);
        color: var(--text);
      }

      button {
        padding: 8px 14px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface-hover);
        color: var(--text);
        cursor: pointer;
        font-size: 0.875rem;
      }

      button:hover:not(:disabled) {
        filter: brightness(1.08);
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      button.btn-primary {
        background: var(--accent);
        color: #0c1920;
        border-color: transparent;
        font-weight: 600;
      }

      html[data-theme="light"] button.btn-primary {
        color: #fff;
      }

      button.btn-theme {
        width: 100%;
        border-color: var(--accent);
        background: var(--accent-dim);
        color: var(--text);
      }

      #status {
        font-size: 0.8125rem;
        color: var(--text-muted);
        margin: 0;
        line-height: 1.4;
      }

      .section-title {
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-muted);
        margin: 0 0 8px;
      }

      ul#participants {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      #participants li {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
      }

      #participants li:last-child {
        border-bottom: 0;
      }

      .peer-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .peer-name {
        font-weight: 600;
        font-size: 0.9rem;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .peer-name.muted-label {
        color: var(--text-muted);
        text-decoration: line-through;
      }

      .peer-vol-row {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
      }

      .peer-vol-row input[type="range"] {
        flex: 1;
        min-width: 0;
        accent-color: var(--accent);
      }

      .peer-vol-val {
        font-size: 0.75rem;
        color: var(--text-muted);
        width: 40px;
        text-align: right;
        flex-shrink: 0;
      }

      .peer-actions {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }

      .peer-actions button {
        padding: 6px 10px;
        font-size: 0.75rem;
      }

      .chat-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        background: var(--bg);
      }

      .chat-header {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }

      .chat-header-title {
        font-weight: 700;
        font-size: 1rem;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .chat-header-menu {
        position: relative;
        flex-shrink: 0;
      }

      .btn-ellipsis {
        width: 36px;
        height: 36px;
        padding: 0;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--input-bg);
        color: var(--text);
        font-size: 1.1rem;
        line-height: 1;
        cursor: pointer;
      }

      .btn-ellipsis:hover:not(:disabled) {
        background: var(--surface-hover);
      }

      .chat-dropdown {
        position: absolute;
        top: 100%;
        right: 0;
        margin-top: 6px;
        min-width: 200px;
        padding: 6px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        z-index: 50;
      }

      .chat-dropdown[hidden] {
        display: none !important;
      }

      .dropdown-item {
        display: block;
        width: 100%;
        text-align: left;
        padding: 10px 12px;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: var(--text);
        font-size: 0.9rem;
        cursor: pointer;
      }

      .dropdown-item:hover {
        background: var(--surface-hover);
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 200;
        padding: 16px;
      }

      .modal-overlay[hidden] {
        display: none !important;
      }

      .modal-dialog {
        width: 100%;
        max-width: 420px;
        max-height: 90vh;
        overflow: auto;
        padding: 20px;
        border-radius: 12px;
        background: var(--surface);
        border: 1px solid var(--border);
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.4);
      }

      .modal-dialog h2 {
        margin: 0 0 16px;
        font-size: 1.15rem;
      }

      .modal-subtitle {
        margin: 16px 0 8px;
        font-size: 1rem;
      }

      .admin-auth-section label {
        display: block;
        margin-bottom: 6px;
        font-size: 0.875rem;
      }

      .admin-auth-section input[type="password"] {
        width: 100%;
        margin-bottom: 10px;
      }

      .admin-auth-error {
        color: var(--danger);
        font-size: 0.875rem;
        margin: 0 0 10px;
      }

      .modal-footnote {
        font-size: 0.8rem;
        color: var(--text-muted);
        margin: 0 0 12px;
      }

      .admin-participant-list {
        list-style: none;
        padding: 0;
        margin: 0 0 16px;
        max-height: 240px;
        overflow-y: auto;
      }

      .admin-participant-hint {
        font-size: 0.875rem;
        color: var(--text-muted);
        padding: 8px 0;
      }

      .admin-participant-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 8px 0;
        border-bottom: 1px solid var(--border);
      }

      .admin-participant-name {
        font-size: 0.9rem;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .btn-kick {
        padding: 6px 10px;
        font-size: 0.75rem;
        border-color: var(--danger);
        color: var(--danger);
      }

      .btn-text {
        border: none;
        background: transparent;
        color: var(--text-muted);
        text-decoration: underline;
        cursor: pointer;
        padding: 8px 0;
        font-size: 0.875rem;
      }

      .admin-modal-actions {
        margin-top: 16px;
        display: flex;
        justify-content: flex-end;
      }

      #chatLog {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 16px 20px;
        font-size: 0.9375rem;
        line-height: 1.45;
        outline: none;
      }

      #chatLog:focus-visible {
        box-shadow: inset 0 0 0 2px var(--accent-dim);
      }

      #chatLog .chat-line {
        margin-bottom: 14px;
        word-break: break-word;
      }

      #chatLog .chat-meta {
        color: var(--text-muted);
        font-size: 0.75rem;
        margin-bottom: 4px;
      }

      #chatLog .chat-image {
        max-width: min(100%, 440px);
        max-height: 380px;
        border-radius: 10px;
        display: block;
        margin-top: 8px;
        object-fit: contain;
        background: var(--surface-hover);
      }

      #chatLog .chat-text {
        margin-top: 6px;
      }

      .chat-footer {
        flex-shrink: 0;
        display: flex;
        gap: 10px;
        padding: 14px 20px;
        border-top: 1px solid var(--border);
        background: var(--surface);
      }

      .chat-footer input[type="text"] {
        flex: 1;
        min-width: 0;
      }

      .nick-field {
        width: 100%;
      }

      .pick-hint {
        font-size: 0.72rem;
        color: var(--text-muted);
        margin: 0;
        line-height: 1.45;
      }

      .discord-channels {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 4px;
      }

      .ch-cat {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .ch-cat-toolbar {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .ch-cat-head {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: 1;
        min-width: 0;
        padding: 4px 2px;
        border: none;
        background: transparent;
        color: var(--text-muted);
        font-size: 0.68rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        cursor: pointer;
        text-align: left;
      }

      .ch-cat-head:hover {
        color: var(--text);
      }

      .ch-cat-chevron {
        display: inline-block;
        width: 0.75rem;
        transition: transform 0.15s ease;
        font-size: 0.55rem;
      }

      .ch-cat[data-collapsed="true"] .ch-cat-chevron {
        transform: rotate(-90deg);
      }

      .ch-cat[data-collapsed="true"] .ch-cat-list {
        display: none;
      }

      .ch-cat-title {
        flex: 1;
      }

      .ch-cat-add {
        flex-shrink: 0;
        padding: 2px 8px;
        min-width: 28px;
        border-radius: 4px;
        border: none;
        background: transparent;
        color: var(--text-muted);
        font-size: 1.1rem;
        line-height: 1;
        cursor: pointer;
      }

      .ch-cat-add:hover {
        color: var(--accent);
      }

      .ch-cat-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .ch-item {
        border-radius: 6px;
        overflow: hidden;
      }

      .ch-item-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        padding: 6px 8px;
        border: none;
        background: transparent;
        color: var(--text-muted);
        font-size: 0.84rem;
        cursor: pointer;
        text-align: left;
        border-radius: 6px;
      }

      .ch-item-btn:hover {
        background: var(--surface-hover);
        color: var(--text);
      }

      .ch-item.selected .ch-item-btn {
        background: var(--surface-hover);
        color: var(--text);
        font-weight: 600;
      }

      .ch-hash {
        color: var(--text-muted);
        font-weight: 600;
      }

      .ch-item-voice .ch-item-btn {
        font-weight: 500;
      }

      .ch-item-voice.active .ch-item-btn {
        color: #4ade80;
      }

      .ch-item-voice .ch-speaker {
        font-size: 0.85rem;
        opacity: 0.85;
      }

      .ch-item-voice.active .ch-speaker {
        opacity: 1;
      }

      .ch-voice-meta {
        margin-left: auto;
        font-size: 0.65rem;
        color: var(--text-muted);
      }

      .ch-item-voice.active .ch-voice-meta {
        color: #4ade80;
      }

      .ch-voice-members {
        list-style: none;
        padding: 0 0 4px 22px;
        margin: 0;
      }

      .ch-voice-members li {
        font-size: 0.78rem;
        color: var(--text-muted);
        padding: 3px 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      @media (max-width: 720px) {
        .mobile-tabs {
          display: flex;
          flex-shrink: 0;
          border-bottom: 1px solid var(--border);
          background: var(--surface);
          padding: 6px 8px;
          gap: 8px;
        }

        .mobile-tabs button {
          flex: 1;
          padding: 12px 10px;
          font-size: 0.9rem;
          min-height: 44px;
          border-radius: 8px;
        }

        .mobile-tabs button[aria-selected="true"] {
          background: var(--accent-dim);
          border-color: var(--accent);
          font-weight: 600;
        }

        .app {
          flex-direction: column;
        }

        .sidebar {
          width: 100%;
          flex: 1;
          min-height: 0;
          border-right: none;
          border-bottom: none;
        }

        .brand {
          padding: 12px 14px;
        }

        .brand .logo {
          width: 56px;
          height: 56px;
          border-radius: 14px;
        }

        .chat-main {
          flex: 1;
          min-height: 0;
        }

        body[data-mobile-panel="room"] .chat-main {
          display: none !important;
        }

        body[data-mobile-panel="chat"] .sidebar {
          display: none !important;
        }

        .chat-footer {
          padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
          gap: 8px;
        }

        .chat-footer button {
          min-height: 44px;
          padding: 10px 12px;
          flex-shrink: 0;
        }

        .chat-header {
          padding: 12px 14px;
          padding-left: max(14px, env(safe-area-inset-left));
          padding-right: max(14px, env(safe-area-inset-right));
        }

        #chatLog {
          padding: 12px 14px;
        }
      }
    </style>
  </head>
  <body data-https-port="3443" data-mobile-panel="room">
    <div class="app">
      <div class="mobile-tabs" role="tablist" aria-label="Разделы">
        <button type="button" id="tabRoomBtn" role="tab" aria-selected="true" aria-controls="roomPanel">
          Комната
        </button>
        <button type="button" id="tabChatBtn" role="tab" aria-selected="false" aria-controls="chatPanel">
          Чат
        </button>
      </div>
      <aside class="sidebar" id="roomPanel" role="tabpanel" aria-labelledby="tabRoomBtn">
        <header class="brand">
          <img class="logo" src="./logo.png" width="88" height="88" alt="zalupa228" />
          <div class="brand-text">
            <span class="brand-name">zalupa228</span>
            <span class="brand-tag">локальный голос и чат</span>
          </div>
        </header>
        <div class="sidebar-scroll">
          <div class="sidebar-body">
            <div class="toolbar">
              <label class="section-title" for="nickname">Имя</label>
              <input
                id="nickname"
                class="nick-field"
                type="text"
                placeholder="ник"
                maxlength="30"
                autocomplete="username"
              />
              <p class="pick-hint" id="pickHint" aria-live="polite">
                Текст: #general · Голос: general
              </p>
              <div class="discord-channels" id="discordChannels">
                <div class="ch-cat" data-collapsed="false" data-cat="text">
                  <div class="ch-cat-toolbar">
                    <button type="button" class="ch-cat-head" aria-expanded="true">
                      <span class="ch-cat-chevron" aria-hidden="true">▼</span>
                      <span class="ch-cat-title">Текстовые каналы</span>
                    </button>
                    <button type="button" class="ch-cat-add" data-add="text" title="Добавить текстовый канал">
                      +
                    </button>
                  </div>
                  <ul class="ch-cat-list" id="textChannelList"></ul>
                </div>
                <div class="ch-cat" data-collapsed="false" data-cat="voice">
                  <div class="ch-cat-toolbar">
                    <button type="button" class="ch-cat-head" aria-expanded="true">
                      <span class="ch-cat-chevron" aria-hidden="true">▼</span>
                      <span class="ch-cat-title">Голосовые каналы</span>
                    </button>
                    <button type="button" class="ch-cat-add" data-add="voice" title="Добавить голосовой канал">
                      +
                    </button>
                  </div>
                  <ul class="ch-cat-list" id="voiceChannelList"></ul>
                </div>
              </div>
              <div class="row">
                <button id="joinBtn" type="button" class="btn-primary">Войти</button>
                <button id="leaveBtn" type="button" disabled>Выйти</button>
                <button id="micBtn" type="button" disabled>Мик: вкл</button>
              </div>
              <div class="row toggles">
                <button id="themeBtn" type="button" class="btn-theme" aria-pressed="true">
                  Тема: тёмная
                </button>
              </div>
              <p id="status">Не подключено</p>
            </div>
            <div>
              <h2 class="section-title">Участники</h2>
              <ul id="participants"></ul>
            </div>
          </div>
          <div class="sidebar-donate">
            <img
              class="donate-qr"
              src="./donate-qr.png?v=1"
              width="132"
              height="132"
              alt="QR-код доната"
              loading="lazy"
            />
            <p class="donate-caption">донат</p>
          </div>
        </div>
      </aside>
      <main class="chat-main" id="chatPanel" role="tabpanel" aria-labelledby="tabChatBtn">
        <header class="chat-header">
          <span id="chatHeaderTitle" class="chat-header-title">Чат</span>
          <div class="chat-header-menu">
            <button
              type="button"
              id="chatMenuBtn"
              class="btn-ellipsis"
              aria-label="Меню"
              aria-expanded="false"
              aria-haspopup="true"
              title="Меню"
            >
              ⋮
            </button>
            <div id="chatDropdown" class="chat-dropdown" role="menu" hidden>
              <button type="button" id="menuThemeBtn" class="dropdown-item" role="menuitem">
                Тема: тёмная
              </button>
              <button type="button" id="menuAdminBtn" class="dropdown-item" role="menuitem">
                Админ-панель
              </button>
            </div>
          </div>
        </header>
        <div id="chatLog" aria-live="polite" tabindex="0" title="Кликните здесь и вставьте фото (Ctrl+V)"></div>
        <footer class="chat-footer">
          <input id="chatImageInput" type="file" accept="image/jpeg,image/png,image/gif,image/webp" hidden />
          <button id="chatImageBtn" type="button" disabled title="Вставить фото">
            Фото
          </button>
          <input id="chatInput" type="text" placeholder="Сообщение…" maxlength="500" disabled />
          <button id="chatSendBtn" type="button" disabled>Отправить</button>
        </footer>
      </main>
    </div>
    <div id="adminModal" class="modal-overlay" hidden>
      <div class="modal-dialog" role="dialog" aria-labelledby="adminModalTitle" aria-modal="true">
        <h2 id="adminModalTitle">Админ-панель</h2>
        <div id="adminAuthSection" class="admin-auth-section">
          <label for="adminPasswordInput">Пароль</label>
          <input
            id="adminPasswordInput"
            type="password"
            autocomplete="current-password"
            maxlength="128"
            placeholder="••••••••"
          />
          <p id="adminAuthError" class="admin-auth-error" hidden role="alert"></p>
          <p id="adminJoinHint" class="modal-footnote" style="margin-top: 0">
            Сначала войдите в комнату (кнопка «Войти»).
          </p>
          <button type="button" id="adminAuthSubmit" class="btn-primary">Войти</button>
        </div>
        <div id="adminPanelBody" hidden>
          <h3 class="modal-subtitle">Участники</h3>
          <ul id="adminParticipantsList" class="admin-participant-list" aria-label="Список участников"></ul>
          <button type="button" id="adminLogoutBtn" class="btn-text">Выйти из админки</button>
        </div>
        <div class="admin-modal-actions">
          <button type="button" id="adminModalClose" class="btn-primary">Закрыть</button>
        </div>
      </div>
    </div>
    <script src="./app.js?v=19"></script>
  </body>
</html>
