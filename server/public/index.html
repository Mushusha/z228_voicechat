<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>zalupa228local</title>
    <link rel="icon" type="image/png" href="./logo.png" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html[data-theme="dark"] {
        --bg: #1d1f24;
        --surface: #23262d;
        --surface-hover: #2b2f38;
        --border: #3a3f4b;
        --text: #f3f4f6;
        --text-muted: #9ca3af;
        --accent: #22d3ee;
        --accent-dim: rgba(34, 211, 238, 0.2);
        --input-bg: #2b2f38;
        --danger: #f87171;
      }

      html[data-theme="light"] {
        --bg: #e6e6e6;
        --surface: #dcdcdc;
        --surface-hover: #d0d0d0;
        --border: #b8b8b8;
        --text: #1a1a1a;
        --text-muted: #4b5563;
        --accent: #0891b2;
        --accent-dim: rgba(8, 145, 178, 0.2);
        --input-bg: #f0f0f0;
        --danger: #dc2626;
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .app {
        display: flex;
        height: 100vh;
        min-height: 0;
      }

      .sidebar {
        width: 288px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        background: var(--surface);
        border-right: 1px solid var(--border);
        min-height: 0;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 18px 16px;
        border-bottom: 1px solid var(--border);
      }

      .brand .logo {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        object-fit: cover;
        flex-shrink: 0;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      }

      .brand-text {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }

      .brand-name {
        font-weight: 700;
        font-size: 1.05rem;
        letter-spacing: -0.02em;
      }

      .brand-tag {
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      .sidebar-scroll {
        flex: 1;
        min-height: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .sidebar-body {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 12px 16px 8px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .sidebar-donate {
        flex-shrink: 0;
        padding: 12px 16px 16px;
        border-top: 1px solid var(--border);
        text-align: center;
        background: var(--surface);
      }

      .donate-qr {
        width: 132px;
        height: 132px;
        max-width: 100%;
        object-fit: contain;
        border-radius: 8px;
        background: #fff;
        padding: 6px;
        display: block;
        margin: 0 auto;
        box-sizing: border-box;
      }

      .donate-caption {
        margin: 10px 0 0;
        font-size: 0.875rem;
        font-weight: 700;
        color: var(--accent);
        letter-spacing: 0.06em;
        text-transform: lowercase;
      }

      .toolbar {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .row.toggles {
        flex-direction: column;
        align-items: flex-start;
      }

      label.chk {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.875rem;
        color: var(--text);
        cursor: pointer;
        user-select: none;
      }

      input[type="text"] {
        flex: 1;
        min-width: 120px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--input-bg);
        color: var(--text);
      }

      button {
        padding: 8px 14px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface-hover);
        color: var(--text);
        cursor: pointer;
        font-size: 0.875rem;
      }

      button:hover:not(:disabled) {
        filter: brightness(1.08);
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      button.btn-primary {
        background: var(--accent);
        color: #0c1920;
        border-color: transparent;
        font-weight: 600;
      }

      html[data-theme="light"] button.btn-primary {
        color: #fff;
      }

      button.btn-theme {
        width: 100%;
        border-color: var(--accent);
        background: var(--accent-dim);
        color: var(--text);
      }

      .btn-mic-sidebar {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 8px 10px;
        min-width: 42px;
      }

      .btn-mic-sidebar .mic-btn-icon {
        flex-shrink: 0;
        width: 20px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--accent);
      }

      .btn-mic-sidebar .mic-btn-icon svg {
        width: 20px;
        height: 20px;
      }

      #status {
        font-size: 0.8125rem;
        color: var(--text-muted);
        margin: 0;
        line-height: 1.4;
      }

      .section-title {
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-muted);
        margin: 0 0 8px;
      }

      ul#participants {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      #participants li {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
      }

      #participants li:last-child {
        border-bottom: 0;
      }

      .peer-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .peer-name {
        font-weight: 600;
        font-size: 0.9rem;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .peer-name.muted-label {
        color: var(--text-muted);
        text-decoration: line-through;
      }

      .peer-vol-row {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
      }

      .peer-vol-row input[type="range"] {
        flex: 1;
        min-width: 0;
        accent-color: var(--accent);
      }

      .peer-vol-val {
        font-size: 0.75rem;
        color: var(--text-muted);
        width: 40px;
        text-align: right;
        flex-shrink: 0;
      }

      .peer-actions {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }

      .peer-actions button {
        padding: 6px 10px;
        font-size: 0.75rem;
      }

      .chat-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        background: var(--bg);
      }

      .chat-header {
        flex-shrink: 0;
        padding: 10px 16px 10px 20px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .chat-header-title {
        font-weight: 700;
        font-size: 1rem;
      }

      .chat-header-menu {
        position: relative;
        flex-shrink: 0;
      }

      .btn-ellipsis {
        width: 40px;
        height: 36px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 1.35rem;
        line-height: 1;
        letter-spacing: 0.02em;
        border-radius: 8px;
        background: var(--surface-hover);
        border: 1px solid var(--border);
        color: var(--text);
        cursor: pointer;
      }

      .btn-ellipsis:hover:not(:disabled) {
        filter: brightness(1.08);
        border-color: var(--accent);
      }

      .chat-dropdown {
        position: absolute;
        right: 0;
        top: calc(100% + 6px);
        min-width: 240px;
        padding: 6px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
        z-index: 100;
      }

      .chat-dropdown[hidden] {
        display: none !important;
      }

      .dropdown-item {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        margin: 0;
        padding: 10px 12px;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: var(--text);
        font-size: 0.875rem;
        text-align: left;
        cursor: pointer;
      }

      .dropdown-item:hover:not(:disabled) {
        background: var(--surface-hover);
      }

      .dropdown-item:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 200;
        padding: 20px;
      }

      .modal-overlay[hidden] {
        display: none !important;
      }

      .modal-dialog {
        width: 100%;
        max-width: 420px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px 22px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      }

      .modal-dialog h2 {
        margin: 0 0 12px;
        font-size: 1.1rem;
      }

      .modal-dialog p {
        margin: 0 0 16px;
        font-size: 0.875rem;
        color: var(--text-muted);
        line-height: 1.5;
      }

      .modal-subtitle {
        margin: 4px 0 8px;
        font-size: 0.95rem;
        font-weight: 600;
      }

      .admin-participant-list {
        list-style: none;
        margin: 0 0 14px;
        padding: 0;
        max-height: 240px;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--input-bg);
      }

      .admin-participant-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
      }

      .admin-participant-row:last-child {
        border-bottom: none;
      }

      .admin-participant-name {
        font-size: 0.875rem;
        min-width: 0;
        word-break: break-word;
      }

      .admin-participant-hint {
        padding: 12px 14px;
        font-size: 0.875rem;
        color: var(--text-muted);
        margin: 0;
      }

      .btn-kick {
        flex-shrink: 0;
        padding: 6px 12px;
        font-size: 0.75rem;
        border-radius: 6px;
        border: 1px solid var(--danger);
        background: transparent;
        color: var(--danger);
        cursor: pointer;
      }

      .btn-kick:hover:not(:disabled) {
        background: rgba(248, 113, 113, 0.12);
      }

      .btn-kick:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      html[data-theme="light"] .btn-kick:hover:not(:disabled) {
        background: rgba(220, 38, 38, 0.1);
      }

      .modal-footnote {
        margin: -6px 0 16px;
        font-size: 0.8rem;
        color: var(--text-muted);
        line-height: 1.45;
      }

      .admin-auth-section label {
        display: block;
        font-size: 0.875rem;
        margin-bottom: 6px;
        color: var(--text);
      }

      .admin-auth-section input[type="password"] {
        width: 100%;
        margin-bottom: 10px;
      }

      .admin-auth-error {
        margin: 0 0 10px;
        font-size: 0.8125rem;
        color: var(--danger);
      }

      .admin-modal-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 16px;
        align-items: center;
      }

      .btn-text {
        background: transparent;
        border: none;
        color: var(--accent);
        text-decoration: underline;
        padding: 6px 0;
        font-size: 0.8125rem;
        cursor: pointer;
      }

      .btn-text:hover:not(:disabled) {
        filter: brightness(1.1);
      }

      .btn-text:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      #chatLog {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 16px 20px;
        font-size: 0.9375rem;
        line-height: 1.45;
        outline: none;
      }

      #chatLog:focus-visible {
        box-shadow: inset 0 0 0 2px var(--accent-dim);
      }

      #chatLog .chat-line {
        margin-bottom: 14px;
        word-break: break-word;
      }

      #chatLog .chat-meta {
        color: var(--text-muted);
        font-size: 0.75rem;
        margin-bottom: 4px;
      }

      #chatLog .chat-image {
        max-width: min(100%, 440px);
        max-height: 380px;
        border-radius: 10px;
        display: block;
        margin-top: 8px;
        object-fit: contain;
        background: var(--surface-hover);
      }

      #chatLog .chat-text {
        margin-top: 6px;
      }

      .chat-footer {
        flex-shrink: 0;
        display: flex;
        gap: 10px;
        padding: 14px 20px;
        border-top: 1px solid var(--border);
        background: var(--surface);
      }

      .chat-footer input[type="text"] {
        flex: 1;
        min-width: 0;
      }

      .nick-field {
        width: 100%;
      }
    </style>
  </head>
  <body data-https-port="3443">
    <div class="app">
      <aside class="sidebar">
        <header class="brand">
          <img class="logo" src="./logo.png" width="88" height="88" alt="zalupa228" />
          <div class="brand-text">
            <span class="brand-name">zalupa228</span>
            <span class="brand-tag">локальный голос и чат</span>
          </div>
        </header>
        <div class="sidebar-scroll">
          <div class="sidebar-body">
            <div class="toolbar">
              <label class="section-title" for="nickname">Имя</label>
              <input
                id="nickname"
                class="nick-field"
                type="text"
                placeholder="ник"
                maxlength="30"
                autocomplete="username"
              />
              <div class="row">
                <button id="joinBtn" type="button" class="btn-primary">Войти</button>
                <button id="leaveBtn" type="button" disabled>Выйти</button>
                <button type="button" id="micBtn" class="btn-mic-sidebar" disabled aria-label="Микрофон">
                  <span class="mic-btn-icon" id="micBtnIcon" aria-hidden="true"></span>
                </button>
              </div>
              <p id="status">Не подключено</p>
            </div>
            <div>
              <h2 class="section-title">Участники</h2>
              <ul id="participants"></ul>
            </div>
          </div>
          <div class="sidebar-donate">
            <img
              class="donate-qr"
              src="./donate-qr.png?v=1"
              width="132"
              height="132"
              alt="QR-код доната"
              loading="lazy"
            />
            <p class="donate-caption">донат</p>
          </div>
        </div>
      </aside>
      <main class="chat-main">
        <header class="chat-header">
          <span class="chat-header-title">Чат</span>
          <div class="chat-header-menu">
            <button
              type="button"
              id="chatMenuBtn"
              class="btn-ellipsis"
              aria-label="Меню"
              aria-expanded="false"
              aria-haspopup="true"
              title="Меню"
            >
              ⋮
            </button>
            <div id="chatDropdown" class="chat-dropdown" role="menu" hidden>
              <button type="button" id="menuThemeBtn" class="dropdown-item" role="menuitem">
                Тема: тёмная
              </button>
              <button type="button" id="menuAdminBtn" class="dropdown-item" role="menuitem">
                Админ-панель
              </button>
            </div>
          </div>
        </header>
        <div id="chatLog" aria-live="polite" tabindex="0" title="Кликните здесь и вставьте фото (Ctrl+V)"></div>
        <footer class="chat-footer">
          <input id="chatImageInput" type="file" accept="image/jpeg,image/png,image/gif,image/webp" hidden />
          <button id="chatImageBtn" type="button" disabled title="Вставить фото">
            Фото
          </button>
          <input id="chatInput" type="text" placeholder="Сообщение…" maxlength="500" disabled />
          <button id="chatSendBtn" type="button" disabled>Отправить</button>
        </footer>
      </main>
    </div>
    <div id="adminModal" class="modal-overlay" hidden>
      <div class="modal-dialog" role="dialog" aria-labelledby="adminModalTitle" aria-modal="true">
        <h2 id="adminModalTitle">Админ-панель</h2>
        <div id="adminAuthSection" class="admin-auth-section">
          <label for="adminPasswordInput">Пароль</label>
          <input
            id="adminPasswordInput"
            type="password"
            autocomplete="current-password"
            maxlength="128"
            placeholder="••••••••"
          />
          <p id="adminAuthError" class="admin-auth-error" hidden role="alert"></p>
          <p id="adminJoinHint" class="modal-footnote" style="margin-top: 0">
            Сначала войдите в комнату (кнопка «Войти»).
          </p>
          <button type="button" id="adminAuthSubmit" class="btn-primary">Войти</button>
        </div>
        <div id="adminPanelBody" hidden>
          <h3 class="modal-subtitle">Участники</h3>
          <ul id="adminParticipantsList" class="admin-participant-list" aria-label="Список участников"></ul>
          <button type="button" id="adminLogoutBtn" class="btn-text">Выйти из админки</button>
        </div>
        <div class="admin-modal-actions">
          <button type="button" id="adminModalClose" class="btn-primary">Закрыть</button>
        </div>
      </div>
    </div>
    <script src="./app.js?v=24"></script>
  </body>
</html>
