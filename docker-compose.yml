services:
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  zalupa228local:
    build: .
    ports:
      - "3000:3000"
      - "3443:3443"
    environment:
      MONGODB_URI: mongodb://mongo:27017/zalupa228local
      CERT_EXTRA_IPS: ${CERT_EXTRA_IPS:-}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo_data:
