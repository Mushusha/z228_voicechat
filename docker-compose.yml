services:
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  zalupa228local:
    build: .
    # Актуальный код сервера с хоста (правки чата без docker build). Уберите том в проде, если нужен только образ.
    volumes:
      - ./server:/app/server
    ports:
      - "3000:3000"
      - "3443:3443"
    environment:
      MONGODB_URI: mongodb://mongo:27017/zalupa228local
      CERT_EXTRA_IPS: ${CERT_EXTRA_IPS:-}
      ADMIN_PANEL_PASSWORD: ${ADMIN_PANEL_PASSWORD:-admin123}
      # TURN для голоса через интернет (VPS). Свой coturn: задайте TURN_* и поставьте 0.
      RTC_USE_OPEN_RELAY: ${RTC_USE_OPEN_RELAY:-1}
      TURN_URLS: ${TURN_URLS:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}
      RTC_ICE_SERVERS: ${RTC_ICE_SERVERS:-}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo_data:
